name: Release LX Flow Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v2.12.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Set up Node dependencies
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $releaseTag = '${{ inputs.tag || github.ref_name }}'
          if ('v' + $version -ne $releaseTag) {
            throw "Tag $releaseTag does not match package.json version $version"
          }

      - name: Build and publish Setup installer
        run: |
          npm run build
          npm run publish:win:setup:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish portable package
        run: npm run publish:win:7z:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
