name: Release LX Flow Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v2.12.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Set up Node dependencies
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $releaseTag = '${{ inputs.tag || github.ref_name }}'
          if ('v' + $version -ne $releaseTag) {
            throw "Tag $releaseTag does not match package.json version $version"
          }

      - name: Build Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run pack:win:setup:x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run pack:win:7z:x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            build/*-Setup.exe
            build/*-Setup.exe.blockmap
            build/latest.yml
            build/*-green.7z
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
